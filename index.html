<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ambiente Padrão — Planilha de Dados</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="robots" content="noindex, nofollow">
<style>
body { margin: 0; font-family:Helvetica,Arial,sans-serif; color:#1d1f24; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #cfd3dc; border-radius: 6px; }
*{box-sizing:border-box}
button,input,select{font-family:inherit}
.ts-cell{width:100%;box-sizing:border-box;min-width:0;outline:none;font-family:Helvetica,Arial,sans-serif;font-size:12px;text-align:right;padding:7px 8px;border:1px solid #ccc;margin:0}
.ts-cell:focus { outline: 2px solid #2a355d; outline-offset: -2px; background: #f8f9ff !important; }
.hbtn{cursor:pointer;background:none;border:1px solid #40444e;color:#c5cad4;border-radius:6px;padding:5px 10px;font-size:11px;white-space:nowrap}
.hbtn:hover{border-color:#8e9bd1;color:#fff}
.hbtn.gold{border-color:#8e9bd1;color:#fff;font-weight:700}
.hbtn.gold:hover{background:#e3e6f3;color:#1d1f24}
.tab{cursor:pointer;padding:7px 10px 7px 16px;border-radius:20px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tab .tm{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:12px;line-height:1;opacity:.75}
.tab .tm:hover{opacity:1;background:rgba(255,255,255,.18)}
.tab.off .tm{display:none}
.tab.off{padding-right:16px}
.tsep{width:1px;height:22px;background:#e1e4ea;margin:0 6px}
.tadd{cursor:pointer;border:1px dashed #c9cdd8;background:none;color:#2a355d;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700}
.tadd:hover{border-style:solid;border-color:#2a355d;background:#eef0f8}
.card{background:#fff;border:1px solid #e1e4ea;border-radius:10px;padding:20px;}
.ct{font-size:13px;font-weight:700}
.cs{font-size:11px;color:#7a808c;margin-top:3px}
.kpi{background:#fff;border:1px solid #e1e4ea;border-radius:10px;padding:16px;min-width:0}
.kpi .kl{font-size:11px;color:#7a808c;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kv{font-size:20px;font-weight:700}
.kpi .kd{font-size:10px;margin-top:6px}
.leg{display:flex;gap:14px;font-size:10px;color:#737987;flex-wrap:wrap;align-items:center}
.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.leg i.dash{width:14px;height:0;border-top:2px dashed #2a355d;border-radius:0;vertical-align:2px}

/* capa (dashboard / comparativo) com fotos da marmoraria */
.hero{position:relative;display:flex;align-items:stretch;background:#1d1f24;border-radius:12px;overflow:hidden;margin-bottom:18px;min-height:200px}
.hero-l{position:relative;z-index:2;flex:1;padding:22px 26px;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-width:0}
.hero-eyebrow{display:flex;align-items:center;gap:10px;color:#8e9bd1;font-size:10.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.hero-eyebrow img{width:26px;height:26px}
.hero h1{margin:8px 0 2px;color:#f7f8fa;font-size:28px;font-weight:700;letter-spacing:.2px}
.hero .sub{color:#9096a3;font-size:12px}
.hero-ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pick{display:inline-flex;align-items:center;background:#2a2d34;border:1px solid #40444e;border-radius:8px;overflow:hidden}
.pick span{font-size:10px;font-weight:700;letter-spacing:1px;color:#9096a3;text-transform:uppercase;padding:0 10px}
.pick select{appearance:none;-webkit-appearance:none;border:0;border-left:1px solid #40444e;background:#33363e url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%238e9bd1' fill='none' stroke-width='1.5'/></svg>") no-repeat right 10px center;color:#fff;font-weight:700;font-size:12.5px;padding:8px 30px 8px 12px;cursor:pointer;outline:none}
.pick select:focus{box-shadow:inset 0 0 0 2px #8e9bd1}
.pick select option{color:#1d1f24;background:#fff}
.vs{color:#6b7180;font-size:16px;font-weight:700}
.pills{display:inline-flex;gap:4px;background:#2a2d34;border:1px solid #40444e;border-radius:18px;padding:3px}
.pills div{cursor:pointer;padding:5px 12px;border-radius:14px;font-size:11px;font-weight:700;color:#9096a3;white-space:nowrap}
.pills div:hover{color:#fff}
.pills div.on{background:#e3e6f3;color:#1d1f24}
.hbtn2{cursor:pointer;background:none;border:1px solid #40444e;color:#e3e6ec;border-radius:8px;padding:8px 12px;font-size:11.5px;font-weight:700;white-space:nowrap}
.hbtn2:hover{border-color:#8e9bd1}
.hero-photos{position:relative;width:46%;max-width:560px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:none}
.hero-photos div{background-size:cover;background-position:center;filter:saturate(.9)}
.hero-photos:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#1d1f24 0%,rgba(29,31,36,.55) 22%,rgba(29,31,36,.05) 55%,rgba(29,31,36,.15) 100%);pointer-events:none}
.hero-photos .cap{position:absolute;right:12px;bottom:10px;z-index:2;color:#e3e6ec;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* planilha */
.band{position:relative;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;min-height:60px;overflow:hidden}
.band b{position:relative;z-index:2;font-size:20px;font-weight:700;letter-spacing:.5px}
.band img.lg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:36px;height:36px;z-index:2}
.band .ph{position:absolute;right:0;top:0;bottom:0;width:40%;background-size:cover;background-position:center 70%;opacity:.75}
.band .ph:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#111 0%,rgba(17,17,17,.4) 50%,rgba(17,17,17,.2) 100%)}
.subline{background:#fff;color:#555;font-size:13px;padding:8px 12px;border:1px solid #ddd;border-top:none;display:flex;align-items:center;justify-content:center;gap:10px;position:relative}
.subline .sb{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:6px}
.lbtn{cursor:pointer;border:1px solid #dcdfe6;background:#f6f7fa;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;color:#565c68}
.lbtn:hover{border-color:#2a355d;color:#1d1f24}

/* menu e diálogo */
.menu{position:fixed;z-index:60;background:#fff;border:1px solid #dcdfe6;border-radius:10px;padding:5px;min-width:230px;box-shadow:0 14px 34px rgba(29,31,36,.18)}
.menu button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left;font-size:12.5px;color:#1d1f24}
.menu button:hover{background:#eef0f6}
.menu button.dg{color:#b3462c}
.menu .mh{font-size:10px;letter-spacing:1px;color:#9096a3;padding:7px 10px 3px;text-transform:uppercase;font-weight:700}
.menu hr{border:0;border-top:1px solid #e9ebf0;margin:4px 2px}
.ov{position:fixed;inset:0;background:rgba(29,31,36,.45);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s;padding:20px}
.ov.on{opacity:1}
.dlg{background:#fff;border-radius:12px;width:min(460px,100%);box-shadow:0 24px 70px rgba(29,31,36,.3);overflow:hidden}
.dlg-h{background:#1d1f24;color:#f7f8fa;padding:16px 20px;display:flex;align-items:center;gap:12px}
.dlg-h img{width:28px;height:28px}
.dlg-h b{display:block;font-size:15px}
.dlg-h small{display:block;color:#9096a3;font-size:11.5px;margin-top:2px}
.dlg-b{padding:18px 20px 6px;display:flex;flex-direction:column;gap:12px}
.dlg-f{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:8px}
.btn{border:1px solid #dcdfe6;background:#fff;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:12.5px;color:#1d1f24}
.btn.pri{background:#1d1f24;color:#fff;border-color:#1d1f24}
.btn.pri:hover{background:#2a355d;border-color:#2a355d;color:#1d1f24}
.btn.dg{background:#b3462c;border-color:#b3462c;color:#fff}
.fld{display:flex;flex-direction:column;gap:5px}
.fld span{font-size:10.5px;color:#7a808c;font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.inp{border:1px solid #dcdfe6;border-radius:8px;padding:9px 11px;background:#fff;outline:none;font-size:14px;color:#1d1f24}
.inp:focus{border-color:#2a355d;box-shadow:0 0 0 3px rgba(42,53,93,.15)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.4;cursor:pointer;color:#1d1f24}
.chk input{accent-color:#2a355d;width:15px;height:15px;margin-top:2px}
.chk small{color:#7a808c;display:block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1px solid #dcdfe6;background:#fff;border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer}
.opt b{display:block;font-size:13.5px;color:#1d1f24}
.opt small{color:#7a808c;font-size:11px}
.opt.on{border-color:#2a355d;background:#eef0f8;box-shadow:0 0 0 3px rgba(42,53,93,.15)}
.toast{position:fixed;bottom:62px;left:50%;transform:translate(-50%,10px);background:#1d1f24;color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;opacity:0;transition:.2s;z-index:120;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{background:#eef0f8;border:1px solid #cdd3ea;color:#2a355d;border-radius:10px;padding:14px 18px;font-size:13px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.hero-mark{display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 70% 40%,#3a3e48 0%,#23262c 55%,#1d1f24 100%);overflow:hidden}
.hero-mark:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 26px),repeating-linear-gradient(28deg,rgba(255,255,255,.025) 0 1px,transparent 1px 41px)}
.hero-mark img{position:relative;width:150px;height:150px;opacity:.95;filter:drop-shadow(0 8px 24px rgba(0,0,0,.45))}
.hero-mark:after{background:linear-gradient(90deg,#1d1f24 0%,rgba(29,31,36,0) 40%)!important}
.legend-row{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:11px;color:#565c68;padding:8px 2px 4px}
.legend-row i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.kpi .kv{white-space:nowrap}
#printInfo{display:none}
@media print{
  @page{size:A4 landscape;margin:8mm}
  html,body{background:#f1f2f5}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .noprint{display:none!important}
  #app{height:auto!important}
  #content{overflow:visible!important;padding:14px 10px 0!important;zoom:.72}
  #printInfo{display:block}
  .card,.kpi,.hero{break-inside:avoid}
  .pick select{background-image:none;padding-right:12px}
}
</style>
</head>

function fromYears(byYear){
  const sheets=Object.keys(byYear).sort().map(y=>({ id:'s'+y, name:'Planilha '+y, year:+y, vals:normVals(byYear[y]) }));
  const last=sheets[sheets.length-1];
  return { version:1, tab:{kind:'dash',id:'d'+last.year},
    sheets, dashboards: sheets.map(s=>({ id:'d'+s.year, name:'Dashboard '+s.year, sheetId:s.id, period:'ALL', auto:true })),
    cmp:{ a:(sheets[sheets.length-2]||sheets[0]).id, b:last.id, period:'ALL' }, savedAt:null };
}

const dashById = id => DB.dashboards.find(d=>d.id===id);
const yearOf = s => s ? (s.year ? String(s.year) : s.name) : '—';

/* ---------- números ---------- */
function parseNum(str){
  if(str==null) return 0;
  let s=String(str).trim(); if(s===''||s==='-'||s==='—') return 0;
  s=s.replace(/R\$\s?/g,'').replace(/%/g,'').trim();
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=parseFloat(s); return isNaN(n)?0:n;
}
const filled = s => s!=null && String(s).trim()!=='';
const isN = v => typeof v==='number' && isFinite(v);
function fmtMoney(n){ return 'R$ ' + Math.round(n).toLocaleString('pt-BR'); }
function fmtMoneyIn(n){ return 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2}); }
function fmtMoney2(n){ return 'R$ ' + n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtPct(n){ return n.toFixed(2).replace('.',',')+'%'; }
function fmtPct1(n){ return n.toFixed(1).replace('.',',')+'%'; }
function fmtNum(n){ return n.toFixed(2).replace('.',','); }
function fmtX(n){ return n.toFixed(1).replace('.',',')+'x'; }
function fmtShort(n){ return n>=1e6 ? 'R$'+(n/1e6).toFixed(2).replace('.',',')+'mi' : n>=1000 ? 'R$'+(n>=1e4?Math.round(n/1000):(n/1000).toFixed(1).replace('.',','))+'k' : 'R$'+Math.round(n); }
function fmtInt(n){ return Math.round(n).toLocaleString('pt-BR'); }
const cap = m => m.charAt(0)+m.slice(1).toLowerCase();
function rangeTxt(idxs){ if(!idxs.length) return '—'; const a=idxs[0], b=idxs[idxs.length-1];
  if(idxs.length===1) return cap(MONTHS12[a]); return (b-a+1===idxs.length) ? cap(MONTHS12[a])+'–'+cap(MONTHS12[b]) : idxs.map(i=>cap(MONTHS12[i])).join(', '); }

function readSheet(id){
  const s=sheetById(id), d={n:{},f:{},sheet:s};
  INPUTS.forEach(fl=>{ d.n[fl.k]=s.vals[fl.k].map(parseNum); d.f[fl.k]=s.vals[fl.k].map(filled); });
  return d;
}
const hasMonth=(d,i)=> ['inv','leads','orc','valOrc','nV','vV'].some(k=>d.f[k][i]);
const hasSales=(d,i)=> d.f.vV[i]||d.f.nV[i];
const totM=(d,i)=> d.n.vV[i];
function calcMonth(d,i){
  const inv=d.n.inv[i], fi=d.f.inv[i];
  return {
    cpl:  fi && d.n.leads[i] ? inv/d.n.leads[i] : null,
    cac:  fi && d.f.nV[i] && d.n.nV[i] ? inv/d.n.nV[i] : null,
    roas: fi && inv && d.f.vV[i] ? d.n.vV[i]/inv : null,
    tkt:  d.f.vV[i] && d.n.nV[i] ? d.n.vV[i]/d.n.nV[i] : null,
    lOrc: d.f.orc[i] && d.n.leads[i] ? d.n.orc[i]/d.n.leads[i]*100 : null,
    oV:   d.f.nV[i] && d.n.orc[i] ? d.n.nV[i]/d.n.orc[i]*100 : null,
    cOrc: fi && d.n.orc[i] ? inv/d.n.orc[i] : null,
  };
}
const CALC_FMT = { cpl:fmtMoney2, cac:fmtMoneyIn, tkt:fmtMoneyIn, cOrc:fmtMoney2, roas:v=>fmtNum(v)+'x', lOrc:fmtPct1, oV:fmtPct1 };
function aggregate(d, idxs){
  const A={};
  const sum=(fn,ok)=>idxs.reduce((s,i)=>s+((!ok||ok(i))?fn(i):0),0);
  ['inv','leads','orc','valOrc','nV','vV'].forEach(k=>A[k]=sum(i=>d.n[k][i]));
  A.tot=A.vV;
  A.anySales = idxs.some(i=>hasSales(d,i));
  const ratio=(num,den,ok)=>{ const b=sum(den,ok); return b? sum(num,ok)/b : null; };
  A.roas = ratio(i=>d.n.vV[i], i=>d.n.inv[i], i=>d.f.vV[i]&&d.f.inv[i]);
  A.cpl  = ratio(i=>d.n.inv[i], i=>d.n.leads[i], i=>d.f.leads[i]&&d.f.inv[i]);
  A.cac  = ratio(i=>d.n.inv[i], i=>d.n.nV[i], i=>d.f.nV[i]&&d.f.inv[i]);
  A.tkt  = ratio(i=>d.n.vV[i], i=>d.n.nV[i], i=>d.f.vV[i]&&d.f.nV[i]);
  A.cOrc = ratio(i=>d.n.inv[i], i=>d.n.orc[i], i=>d.f.orc[i]&&d.f.inv[i]);
  A.lOrc = ratio(i=>d.n.orc[i], i=>d.n.leads[i], i=>d.f.orc[i]&&d.f.leads[i]);
  A.oV   = ratio(i=>d.n.nV[i], i=>d.n.orc[i], i=>d.f.nV[i]&&d.f.orc[i]);
  return A;
}
function delta(vals, ok, idxs, lowGood){
  const p=idxs.filter(i=>ok(i) && vals[i]!=null && vals[i]>0);
  if(p.length<2) return { deltaText:'—', deltaColor:'#9096a3' };
  const a=vals[p[p.length-2]], b=vals[p[p.length-1]], d=(b-a)/a*100;
  const good = lowGood ? d<=0 : d>=0;
  return { deltaText:(d>=0?'▲ ':'▼ ')+Math.abs(d).toFixed(1).replace('.',',')+'% '+MONTHS12[p[p.length-1]]+' vs '+MONTHS12[p[p.length-2]], deltaColor: good?GREEN:RED };
}

/* ---------- PLANILHA ---------- */
const GRID = 'grid-template-columns:250px repeat(12,minmax(86px,1fr)) 116px;';
function totalFor(id, key){
  const d=readSheet(id), all=QUARTERS.ALL, f=INPUTS.find(x=>x.k===key);
  if(f){ if(!d.f[key].some(Boolean)) return ''; const s=d.n[key].reduce((a,b)=>a+b,0); return f.t==='money'? fmtMoneyIn(s) : fmtInt(s); }
  const A=aggregate(d,all);
  const v = (key==='lOrc'||key==='oV') ? (A[key]!=null?A[key]*100:null) : A[key];
  return v==null ? '' : CALC_FMT[key](v);
}
const secRow = t => `<div style="display:flex;align-items:center;gap:8px;padding:9px 2px 4px;"><span style="font-size:9.5px;font-weight:700;color:#7a808c;letter-spacing:.9px;white-space:nowrap;">${t}</span><span style="flex:1;height:1px;background:#d0d4dc;"></span></div>`;

  const head=`<div style="display:grid;${GRID}">
      <div style="background:#d9dce3;font-weight:700;font-size:12px;padding:8px 10px;border:1px solid #b9bec9;">MÉTRICAS</div>
      ${MONTHS12.map(m=>`<div style="background:#d9dce3;font-weight:700;font-size:12px;padding:8px 6px;text-align:center;border:1px solid #b9bec9;">${m}</div>`).join('')}

    rows+=`<div style="display:grid;${GRID}">

      ${s.vals[f.k].map((v,i)=>`<input class="ts-cell" inputmode="decimal" data-k="${f.k}" data-i="${i}" value="${esc(v)}" style="background:${f.cell};color:${INK};">`).join('')}

  });
  rows+=secRow('⚙️ INDICADORES · CALCULADOS AUTOMATICAMENTE — NÃO PRECISA PREENCHER');
  CALCS.forEach((c,ci)=>{
    rows+=`<div style="display:grid;${GRID}">
      <div style="background:${ci%2?'#dfe2e9':'#eceef3'};font-weight:700;font-size:12px;padding:7px 10px;border:1px solid #ccd0d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${CALC_HINT[c.k]}">${c.label}</div>
      ${MONTHS12.map((_,i)=>`<input class="ts-cell" readonly tabindex="-1" data-calc="${c.k}" data-i="${i}" title="${CALC_HINT[c.k]}" style="background:#f5f6f9;color:#666c78;font-style:italic;font-weight:${c.bold?700:400};cursor:not-allowed;">`).join('')}
      <div data-total="${c.k}" style="background:#e8eaef;font-style:italic;font-weight:700;font-size:12px;text-align:right;padding:7px 8px;border:1px solid #ccd0d8;color:#474c57;white-space:nowrap;"></div>
    </div>`;
  });
  const dash=DB.dashboards.find(d=>d.sheetId===s.id);
  return `<div>
    <div class="band"><img class="lg" src="${LOGO}" alt="AP"><b>CONTROLE DE LEADS – AMBIENTE PADRÃO</b>${bandPhoto()}</div>
    <div class="subline">${esc(s.name)} · clique numa célula para editar · Enter desce para a linha de baixo
      <div class="sb noprint"><button class="lbtn" data-act="dupSheet" title="Cria a planilha de outro ano com as mesmas linhas">⧉ Duplicar planilha</button>${dash?`<button class="lbtn" data-act="openDash" data-id="${dash.id}">Ver ${esc(dash.name)} →</button>`:`<button class="lbtn" data-act="newDashFor">+ Criar dashboard</button>`}</div></div>
    <div class="legend-row"><span><i style="background:#c6efce;border:1px solid #a9d8b3"></i>✏️ Linhas brancas e verdes: você preenche</span><span><i style="background:#e8eaef;border:1px dashed #9aa0ac"></i>⚙️ Linhas em itálico: automáticas</span><span style="color:#9aa0ac">Deixe em branco o que ainda não tiver (não use “x”). “—” = falta dado para calcular.</span></div>
    <div style="overflow-x:auto;"><div style="min-width:1340px;">${head}${rows}</div></div>

    <b>ROAS</b> = valor em vendas ÷ valor investido · <b>CAC</b> = valor investido ÷ vendas fechadas · <b>Ticket médio</b> = valor em vendas ÷ vendas fechadas.</div>
  </div>`;
}
function refreshCalc(id){
  const d=readSheet(id), cm=MONTHS12.map((_,i)=>calcMonth(d,i));
  document.querySelectorAll('input[data-calc]').forEach(el=>{ const i=+el.dataset.i, k=el.dataset.calc, v=cm[i][k]; el.value = v!=null ? CALC_FMT[k](v) : (hasMonth(d,i)?'—':''); });
  document.querySelectorAll('[data-total]').forEach(el=>{ el.textContent=totalFor(id,el.dataset.total); });
}

/* ---------- barras (HTML) ---------- */
function barsChart(o){
  const mx=o.max||1;
  const cols=o.cols.map(c=>{
    const total=c.parts.reduce((s,p)=>s+p.v,0);
    const stack = (!c.empty && total>0)
      ? [...c.parts].reverse().filter(p=>p.v>0).map((p,k)=>`<div style="width:100%;background:${p.color};height:calc((100% - 15px) * ${p.v/mx});${k===0?'border-radius:3px 3px 0 0;':''}"></div>`).join('')
      : `<div style="width:100%;height:2px;background:#e6e8ee;"></div>`;
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;height:100%;min-width:0;" title="${c.tip||''}">
      <div style="flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:0;">
        <div style="font-size:9px;color:${c.empty?'#b0b5bf':c.valueColor};font-weight:${c.empty?400:700};font-style:${c.empty?'italic':'normal'};margin-bottom:3px;white-space:nowrap;">${c.valueLabel||''}</div>
        ${stack}
      </div>
      <div style="height:10px;line-height:10px;font-size:9px;color:#9096a3;margin-top:6px;">${c.label}</div>
    </div>`;
  }).join('');
  let svg='';
  if(o.line){
    const n=o.cols.length, area=o.h-16, pts=[];
    o.line.forEach((v,i)=>{ if(v!=null) pts.push([ (i+0.5)/n*1000, area - (area-15)*Math.min(1,v/mx) ]); });
    if(pts.length>1) svg=`<svg viewBox="0 0 1000 ${area}" preserveAspectRatio="none" style="position:absolute;left:0;top:0;width:100%;height:${area}px;pointer-events:none;overflow:visible;">
      <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${GOLD}" stroke-width="2.5" stroke-dasharray="7 5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`
      + pts.map(p=>`<div style="position:absolute;left:calc(${p[0]/10}% - 4px);top:${p[1]-4}px;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid ${GOLD};box-sizing:border-box;pointer-events:none;"></div>`).join('');
  }
  return `<div style="position:relative;"><div style="display:flex;align-items:flex-end;gap:8px;height:${o.h}px;">${cols}</div>${svg}</div>`;
}

const photosHtml=(keys,cap)=> PH ? `<div class="hero-photos noprint">${keys.map(k=>`<div style="background-image:url(${photo(k)})"></div>`).join('')}<span class="cap">${cap}</span></div>`

const sheetOptions = sel => sheets().map(s=>`<option value="${s.id}"${s.id===sel?' selected':''}>${esc(s.name)}</option>`).join('');

function funnelHtml(d, idxs, s){
  const full = idxs.filter(i=> d.f.leads[i] && d.f.orc[i] && d.f.nV[i]);
  const out  = idxs.filter(i=> hasMonth(d,i) && !full.includes(i));
  const sum=k=>full.reduce((t,i)=>t+d.n[k][i],0);
  const L=sum('leads'), O=sum('orc'), N=sum('nV'), VV=sum('vV'), INV=sum('inv');
  const vo = full.filter(i=>d.f.valOrc[i]), VO=vo.reduce((t,i)=>t+d.n.valOrc[i],0), VVo=vo.reduce((t,i)=>t+d.n.vV[i],0), Oo=vo.reduce((t,i)=>t+d.n.orc[i],0);
  if(!full.length) return `<div class="card" style="margin-bottom:16px;"><div class="ct">Funil de Conversão</div><div class="cs">Preencha leads, orçamentos e vendas fechadas na ${esc(s.name)} para ver o funil.</div></div>`;
  const stages=[
    { label:'LEADS DO TRÁFEGO', value:fmtInt(L),  color:GOLD,  w:100 },
    { label:'ORÇAMENTOS',       value:fmtInt(O),  color:MID,   w:78  },
    { label:'VENDAS FECHADAS',  value:fmtInt(N),  color:STEEL, w:58  },
    { label:'VALOR VENDIDO',    value:fmtMoney(VV), color:GREEN, w:44 },
  ];
  const steps=[
    `<b>${L?fmtPct1(O/L*100):'—'}</b> dos leads viram orçamento`,
    `<b>${O?fmtPct1(N/O*100):'—'}</b> dos orçamentos viram venda`,
    `<b>${N?fmtMoney(VV/N):'—'}</b> é o ticket médio de cada venda`,
  ];
  let f='';
  stages.forEach((st,k)=>{
    const next = stages[k+1] ? stages[k+1].w : st.w*0.86, inset = ((st.w-next)/2)/st.w*100;
    f+=`<div style="width:${st.w}%;margin:0 auto;height:52px;background:${st.color};clip-path:polygon(0 0,100% 0,${100-inset}% 100%,${inset}% 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;">
        <div style="font-size:10px;font-weight:700;letter-spacing:.6px;opacity:.85;">${st.label}</div>
        <div style="font-size:18px;font-weight:700;margin-top:1px;">${st.value}</div></div>`;
    if(steps[k]) f+=`<div style="text-align:center;font-size:11px;color:#565c68;padding:5px 0;">↓ ${steps[k]}</div>`;
  });
  const per100 = VO? Math.round(VVo/VO*100) : null;
  const box=(t,v,c,h)=>`<div style="background:#f5f6f9;border:1px solid #e6e8ee;border-radius:8px;padding:12px 14px;"${h?` title="${h}"`:''}><div style="font-size:10px;color:#7a808c;text-transform:uppercase;letter-spacing:.4px;">${t}</div><div style="font-size:20px;font-weight:700;color:${c};margin-top:4px;">${v}</div></div>`;
  return `<div class="card" style="margin-bottom:16px;">
    <div class="ct">Funil de Conversão</div>
    <div class="cs" style="margin-bottom:14px;">Do lead ao dinheiro no caixa · ${rangeTxt(full)}${out.length?` <span style="color:#9aa0ac;">(fora do funil: ${out.map(i=>MONTHS12[i]).join(', ')} — ainda faltam dados)</span>`:''}</div>
    <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:center;">
      <div>${f}</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${per100!=null?`<div style="background:${GREEN};color:#fff;border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.45;">A cada <b>R$ 100</b> orçados,<br><b style="font-size:22px;">R$ ${per100}</b> viram venda.</div>`:''}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          ${box('Valor orçado', VO?fmtMoney(VO):'—', INK)}
          ${box('Valor médio / orçamento', Oo?fmtMoney(VO/Oo):'—', GOLD)}
          ${box('CAC · custo por venda', N?fmtMoney(INV/N):'—', GOLD, CALC_HINT.cac)}
          ${box('Ticket médio', N?fmtMoney(VV/N):'—', GREEN, CALC_HINT.tkt)}
        </div>
      </div>
    </div>
  </div>`;
}

function convHtml(d, idxs, per){
  const A=aggregate(d,idxs), rate=A.oV!=null?A.oV*100:null;
  const R=58, C=2*Math.PI*R, la=rate!=null? C*Math.min(100,rate)/100 : 0;
  const donut=`<svg viewBox="0 0 160 160" style="width:150px;height:150px;display:block;margin:0 auto;">
      <circle cx="80" cy="80" r="${R}" fill="none" stroke="#e6e8ee" stroke-width="22"/>
      ${rate?`<circle cx="80" cy="80" r="${R}" fill="none" stroke="${GREEN}" stroke-width="22" stroke-dasharray="${la} ${C-la}" transform="rotate(-90 80 80)"/>`:''}
      <text x="80" y="80" text-anchor="middle" font-size="26" font-weight="700" fill="${GREEN}" font-family="Helvetica,Arial,sans-serif">${rate!=null?fmtPct1(rate):'—'}</text>
      <text x="80" y="98" text-anchor="middle" font-size="10" fill="#7a808c" font-family="Helvetica,Arial,sans-serif">viram venda</text></svg>`;
  const mx=Math.max(1,...idxs.map(i=>d.n.orc[i]));

let ACC=null;
function niceMax(v){ if(!(v>0)) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p; return (n<=1?1:n<=1.2?1.2:n<=1.5?1.5:n<=2?2:n<=2.5?2.5:n<=3?3:n<=4?4:n<=5?5:n<=6?6:n<=8?8:10)*p; }
function drawAcc(){
  const el=document.getElementById('accChart'); if(!el||!ACC) return;
  const {accA,accB,idx,lim,na,nb}=ACC, n=idx.length, W=Math.max(320,el.clientWidth), H=240, pl=64, pr=20, pt=16, pb=26;
  const all=[...accA,...accB].filter(v=>v!=null);
  const mx=niceMax(Math.max(1,...all)*1.05);
  const X=k=>pl+(W-pl-pr)*(n>1?k/(n-1):.5), Y=v=>pt+(H-pt-pb)*(1-v/mx);
  const line=(arr,c,nm)=>{ const p=arr.map((v,k)=>v==null?null:[X(k),Y(v),v,k]).filter(Boolean);
    return `<polyline points="${p.map(q=>q[0]+','+q[1]).join(' ')}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>`+
      p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#fff" stroke="${c}" stroke-width="2.5"><title>${nm} · ${MONTHS_FULL[idx[q[3]]]}: ${fmtMoney(q[2])} acumulados</title></circle>`).join(''); };
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="#e9ebf0"/><text x="${pl-8}" y="${Y(mx*f)+4}" font-size="11" text-anchor="end" fill="#9096a3">${fmtShort(mx*f)}</text>`).join('');
  const lab=(arr,c,above,tag)=>{ const k=arr.map((v,j)=>v!=null?j:-1).filter(j=>j>=0).pop(); if(k==null) return ''; const end=k>=n-3;
    const ty = above? Y(arr[k])-12 : Math.max(Y(arr[k]), k>0&&arr[k-1]!=null?Y(arr[k-1]):0)+22;
    return `<text x="${X(k)+(end?-10:10)}" y="${ty}" font-size="12" font-weight="700" fill="${c}" text-anchor="${end?'end':'start'}" paint-order="stroke" stroke="#fff" stroke-width="4">${MONTHS12[idx[k]]}/${tag}: ${fmtMoney(arr[k])}</text>`; };
  const tagA=String(na).slice(-2), tagB=String(nb).slice(-2);
  const same = lim>=0 && lim<n-1 && accA[lim]!=null ? `<circle cx="${X(lim)}" cy="${Y(accA[lim])}" r="6" fill="none" stroke="${GOLD}" stroke-width="2"/><text x="${X(lim)+10}" y="${Y(accA[lim])+18}" font-size="12" font-weight="700" fill="${GOLD}" paint-order="stroke" stroke="#fff" stroke-width="4">${MONTHS12[idx[lim]]}/${tagA}: ${fmtMoney(accA[lim])}</text>`:'';
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;font-family:Helvetica,Arial,sans-serif;">${grid}
    ${idx.map((m,k)=>`<text x="${X(k)}" y="${H-6}" font-size="10" text-anchor="middle" fill="#9096a3">${MONTHS12[m]}</text>`).join('')}
    ${lim>=0 && lim<n-1?`<line x1="${X(lim)}" x2="${X(lim)}" y1="${pt}" y2="${H-pb}" stroke="#cfd3dc" stroke-dasharray="4 4"/>`:''}
    ${line(accA,GOLD,na)}${line(accB,GREEN,nb)}${lab(accA,GOLD,false,tagA)}${same}${lab(accB,GREEN,true,tagB)}</svg>`;
}

        <div style="font-size:19px;font-weight:700;color:${CB};margin-top:3px;">${k.ok?k.fmt(k.vb):'—'}</div>
        <div style="margin-top:6px;"><span style="display:inline-block;font-size:11px;font-weight:700;color:${bd.c};background:${bd.bg};padding:2px 8px;border-radius:10px;">${bd.t} vs ${esc(na)}</span></div>
      </div>`; }).join('')}</div>
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
        <div><div class="ct">Valor em Vendas Acumulado ${per==='ALL'?'no Ano':'no Trimestre'}</div><div class="cs">Vendas do tráfego pago somadas mês a mês</div></div>
        <div style="font-size:12px;color:#3a3f4a;">${cmpTxt}</div>
      </div><div id="accChart"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
      ${group('Valor em Vendas por Mês','Vendas fechadas com clientes do tráfego pago',i=>a.n.vV[i],i=>b.n.vV[i],i=>a.f.vV[i],i=>b.f.vV[i],fmtShort,L.tot)}
      ${group('ROAS por Mês','Valor em vendas ÷ valor investido',i=>cA[i].roas,i=>cB[i].roas,i=>cA[i].roas!=null,i=>cB[i].roas!=null,v=>fmtNum(v)+'x',L.roas)}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
      ${group('Investimento por Mês','Valor investido em anúncios',i=>a.n.inv[i],i=>b.n.inv[i],i=>a.f.inv[i],i=>b.f.inv[i],fmtShort,L.inv)}
      ${group('Leads por Mês','Leads do tráfego pago',i=>a.n.leads[i],i=>b.n.leads[i],i=>a.f.leads[i],i=>b.f.leads[i],v=>String(Math.round(v)),L.leads)}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      ${group('Orçamentos por Mês','Orçamentos gerados pelo tráfego pago',i=>a.n.orc[i],i=>b.n.orc[i],i=>a.f.orc[i],i=>b.f.orc[i],v=>String(Math.round(v)),L.orc)}
      ${group('Vendas Fechadas por Mês','Quantidade de vendas do tráfego pago',i=>a.n.nV[i],i=>b.n.nV[i],i=>a.f.nV[i],i=>b.f.nV[i],v=>String(Math.round(v)),L.nv)}
    </div>
  </div>`;
}
/* ---------- abas ---------- */
function tabList(){
  return [...sheets().map(s=>({kind:'sheet',id:s.id,name:s.name})), ...DB.dashboards.map(d=>({kind:'dash',id:d.id,name:d.name})), {kind:'cmp',id:'cmp',name:'Comparativo'}];
}
function validTab(){ const t=DB.tab||{}; const ok = t.kind==='sheet'? sheetById(t.id) : t.kind==='dash'? dashById(t.id) : t.kind==='cmp'; if(!ok) DB.tab={kind:'sheet',id:sheets()[0].id}; }
function renderTabs(){
  const list=tabList(); let html='', last=null;
  list.forEach(t=>{ if(last && last!==t.kind) html+='<span class="tsep"></span>'; last=t.kind;
    const on = DB.tab.kind===t.kind && DB.tab.id===t.id;
    html+=`<div class="tab${on?'':' off'}" data-tab="${t.kind}" data-id="${t.id}" style="background:${on?'#1d1f24':'transparent'};color:${on?'#f7f8fa':'#737987'};">${esc(t.name)}${t.kind!=='cmp'?`<span class="tm" data-tmenu title="Opções: duplicar, renomear, excluir">⋯</span>`:''}</div>`; });
  html+=`<span class="tsep"></span><button class="tadd" id="tadd" title="Criar planilha de um novo ano ou um novo dashboard">+ Novo</button>`;
  document.getElementById('tabs').innerHTML=html;
}
function render(){
  validTab(); renderTabs();
  const t=DB.tab, el=document.getElementById('content');
  if(t.kind==='sheet'){ el.innerHTML=renderTable(sheetById(t.id)); refreshCalc(t.id); }
  else if(t.kind==='dash'){ el.innerHTML=renderDash(dashById(t.id)); }
  else { el.innerHTML=renderComp(); drawAcc(); }
}
function goTab(kind,id){ DB.tab={kind,id}; saveUI(); render(); document.getElementById('content').scrollTop=0; }

/* ---------- ações: planilha nova, duplicar dashboard, renomear, excluir ---------- */
function toast(msg){ let t=document.querySelector('.toast'); if(!t){ t=document.createElement('div'); t.className='toast'; document.body.appendChild(t); } t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2400); }
function modal({title, sub, body, ok='Confirmar', danger=false, onOk}){
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><div class="dlg-h"><img src="${LOGO}" alt=""><div><b>${title}</b>${sub?`<small>${sub}</small>`:''}</div></div><div class="dlg-b">${body}</div>
    <div class="dlg-f"><button class="btn" data-x>Cancelar</button><button class="btn ${danger?'dg':'pri'}" data-ok>${ok}</button></div></div>`;
  document.body.appendChild(ov); requestAnimationFrame(()=>ov.classList.add('on'));
  const close=()=>{ ov.classList.remove('on'); setTimeout(()=>ov.remove(),160); document.removeEventListener('keydown',kd); };
  const kd=e=>{ if(e.key==='Escape') close(); if(e.key==='Enter'){ e.preventDefault(); ov.querySelector('[data-ok]').click(); } };
  document.addEventListener('keydown',kd);
  ov.addEventListener('click',e=>{ if(e.target===ov||e.target.closest('[data-x]')) close(); const o=e.target.closest('.opt'); if(o){ ov.querySelectorAll('.opt').forEach(x=>x.classList.remove('on')); o.classList.add('on'); } });
  ov.querySelector('[data-ok]').addEventListener('click',()=>{ if(onOk(ov)!==false) close(); });
  setTimeout(()=>{ const f=ov.querySelector('input,select'); if(f) f.focus(); },50);
}
const filledCount = id => { const d=readSheet(id); return QUARTERS.ALL.filter(i=>hasMonth(d,i)).length; };
const sheetPicker = sel => `<div class="opts">${sheets().map(s=>{ const n=filledCount(s.id); return `<button type="button" class="opt${s.id===sel?' on':''}" data-v="${s.id}"><b>${esc(s.name)}</b><small>${n? n+(n>1?' meses lançados':' mês lançado') : 'em branco'}</small></button>`; }).join('')}</div>`;
function newDashName(s){ let nm='Dashboard '+yearOf(s); if(DB.dashboards.some(d=>d.name===nm)){ let k=2; while(DB.dashboards.some(d=>d.name===nm+' ('+k+')')) k++; nm+=' ('+k+')'; } return nm; }

function flowNewSheet(fromId){
  const base = fromId || sheets()[sheets().length-1].id;
  const next = Math.max(...DB.sheets.map(s=>s.year||0))+1;
  modal({ title: fromId? 'Duplicar planilha' : 'Nova planilha', sub:'Cria a planilha de outro ano com as mesmas linhas e cálculos.',
    body:`<label class="fld"><span>Ano da nova planilha</span><input id="f-year" class="inp" type="number" min="2000" max="2100" value="${next}"></label>
      <label class="fld"><span>Copiar a estrutura de</span><select id="f-from" class="inp">${sheetOptions(base)}</select></label>
      <label class="chk"><input type="checkbox" id="f-vals"><span>Copiar também os valores digitados<small>Normalmente fica desmarcado: o ano novo começa em branco.</small></span></label>
      <label class="chk"><input type="checkbox" id="f-dash" checked><span>Criar também o <b>dashboard</b> deste ano<small>Já vem puxando os dados da planilha nova.</small></span></label>`,
    ok:'Criar planilha',
    onOk(ov){ const y=+ov.querySelector('#f-year').value; if(!y){ toast('Informe o ano'); return false; }
      if(DB.sheets.some(s=>s.year===y)){ toast(`Já existe a Planilha ${y}`); return false; }
      const src=sheetById(ov.querySelector('#f-from').value);
      const s={ id:uid('s'), name:'Planilha '+y, year:y, vals: ov.querySelector('#f-vals').checked ? normVals(src.vals) : normVals(null) };
      DB.sheets.push(s);
      let d=null; if(ov.querySelector('#f-dash').checked){ d={ id:uid('d'), name:newDashName(s), sheetId:s.id, period:'ALL', auto:true }; DB.dashboards.push(d); }
      save(); toast(`Planilha ${y} criada`+(d?' + '+d.name:'')); goTab('sheet', s.id); }
  });
}
function flowDupDash(id){
  const src=dashById(id);
  const free = sheets().find(s=>!DB.dashboards.some(d=>d.sheetId===s.id));
  modal({ title:'Duplicar dashboard', sub:'De qual planilha o novo dashboard vai puxar os dados?', body: sheetPicker(free? free.id : src.sheetId), ok:'Criar dashboard',
    onOk(ov){ const sid=ov.querySelector('.opt.on').dataset.v, s=sheetById(sid);
      const d={ id:uid('d'), name:newDashName(s), sheetId:sid, period:src.period||'ALL', auto:true };
      DB.dashboards.push(d); save(); toast(d.name+' criado'); goTab('dash', d.id); } });
}
function flowNewDash(prefSheet){
  modal({ title:'Novo dashboard', sub:'De qual planilha o dashboard vai puxar os dados?', body: sheetPicker(prefSheet||sheets()[sheets().length-1].id), ok:'Criar dashboard',
    onOk(ov){ const sid=ov.querySelector('.opt.on').dataset.v, s=sheetById(sid); const d={ id:uid('d'), name:newDashName(s), sheetId:sid, period:'ALL', auto:true };
      DB.dashboards.push(d); save(); toast(d.name+' criado'); goTab('dash', d.id); } });
}
function flowRename(kind,id){
  const o= kind==='sheet'? sheetById(id) : dashById(id);
  modal({ title:'Renomear', body:`<label class="fld"><span>Nome</span><input id="f-name" class="inp" value="${esc(o.name)}"></label>`, ok:'Salvar',
    onOk(ov){ const v=ov.querySelector('#f-name').value.trim(); if(!v) return false; o.name=v; o.auto=false;
      if(kind==='sheet'){ const m=v.match(/(19|20)\d{2}/); if(m) o.year=+m[0]; } save(); render(); } });
}
function flowDelete(kind,id){
  const o= kind==='sheet'? sheetById(id) : dashById(id);
  if(kind==='sheet' && DB.sheets.length<=1){ toast('Precisa existir pelo menos uma planilha'); return; }
  modal({ title:`Excluir “${esc(o.name)}”?`, sub: kind==='sheet'? 'Os valores desta planilha serão apagados. Dica: faça um backup antes.' : 'Isso não apaga nenhum dado da planilha.', ok:'Excluir', danger:true,
    body: kind==='sheet'? `<div style="font-size:12.5px;color:#565c68;line-height:1.5">Dashboards que puxavam desta planilha passam a puxar da planilha mais recente.</div>` : `<div style="font-size:12.5px;color:#565c68">O dashboard será removido das abas.</div>`,
    onOk(){ if(kind==='sheet'){ DB.sheets=DB.sheets.filter(s=>s.id!==id); const fb=sheets()[sheets().length-1];
        DB.dashboards.forEach(d=>{ if(d.sheetId===id){ d.sheetId=fb.id; if(d.auto) d.name=newDashName(fb); } }); if(DB.cmp.a===id) DB.cmp.a=sheets()[0].id; if(DB.cmp.b===id) DB.cmp.b=fb.id; }
      else DB.dashboards=DB.dashboards.filter(d=>d.id!==id);
      save(); toast('Excluído'); render(); } });
}
function setSource(dashId, sheetId){
  const d=dashById(dashId), s=sheetById(sheetId); d.sheetId=sheetId;
  if(d.auto){ const others=DB.dashboards.filter(x=>x.id!==d.id); let nm='Dashboard '+yearOf(s); if(others.some(x=>x.name===nm)){ let k=2; while(others.some(x=>x.name===nm+' ('+k+')')) k++; nm+=' ('+k+')'; } d.name=nm; }
  save(); render(); toast('Puxando dados da '+s.name);
}

/* ---------- menus ---------- */
function menu(anchor, items, head){
  closeMenu(); const r=anchor.getBoundingClientRect(), m=document.createElement('div'); m.className='menu'; m.id='menu';
  m.innerHTML=(head?`<div class="mh">${head}</div>`:'')+items.map((it,i)=> it==='-'?'<hr>':`<button data-i="${i}" class="${it[2]?'dg':''}">${it[0]}</button>`).join('');
  document.body.appendChild(m);
  m.style.left=Math.max(8,Math.min(r.left, innerWidth-m.offsetWidth-8))+'px'; m.style.top=Math.max(8, r.top-m.offsetHeight-8)+'px';
  m.addEventListener('click',e=>{ const b=e.target.closest('[data-i]'); if(!b) return; closeMenu(); items[+b.dataset.i][1](); });
  setTimeout(()=>document.addEventListener('click',closeMenu,{once:true}),0);
}
function closeMenu(){ const m=document.getElementById('menu'); if(m) m.remove(); }
function tabMenu(kind,id,anchor){
  const items = kind==='sheet'
    ? [['⧉  Duplicar planilha (novo ano)',()=>flowNewSheet(id)],['◔  Criar dashboard desta planilha',()=>flowNewDash(id)],['✎  Renomear',()=>flowRename('sheet',id)],'-',['Excluir planilha',()=>flowDelete('sheet',id),1]]
    : [['⧉  Duplicar dashboard',()=>flowDupDash(id)],['✎  Renomear',()=>flowRename('dash',id)],'-',['Excluir dashboard',()=>flowDelete('dash',id),1]];
  menu(anchor, items);
}

/* ---------- eventos ---------- */
const tabsEl=document.getElementById('tabs');
tabsEl.addEventListener('click',e=>{
  if(e.target.closest('#tadd')){ e.stopPropagation(); menu(e.target.closest('#tadd'),[['▦  Planilha de um novo ano',()=>flowNewSheet(null)],['◔  Novo dashboard (escolher planilha)',()=>flowNewDash(null)]],'Criar'); return; }
  const t=e.target.closest('[data-tab]'); if(!t) return;
  if(e.target.closest('[data-tmenu]')){ e.stopPropagation(); tabMenu(t.dataset.tab==='dash'?'dash':'sheet', t.dataset.id, t); return; }
  goTab(t.dataset.tab, t.dataset.id);
});
tabsEl.addEventListener('contextmenu',e=>{ const t=e.target.closest('[data-tab]'); if(!t||t.dataset.tab==='cmp') return; e.preventDefault(); tabMenu(t.dataset.tab, t.dataset.id, t); });
const content=document.getElementById('content');
content.addEventListener('click',e=>{
  const p=e.target.closest('[data-per]'); if(p){ dashById(DB.tab.id).period=p.dataset.per; save(); render(); return; }
  const cp=e.target.closest('[data-cper]'); if(cp){ DB.cmp.period=cp.dataset.cper; save(); render(); return; }
  const a=e.target.closest('[data-act]'); if(!a) return; const k=a.dataset.act;
  if(k==='dupDash') flowDupDash(DB.tab.id);
  if(k==='dupSheet') flowNewSheet(DB.tab.id);
  if(k==='newDashFor') flowNewDash(DB.tab.id);
  if(k==='openDash') goTab('dash', a.dataset.id);
  if(k==='openSheet') goTab('sheet', a.dataset.id);
});
content.addEventListener('change',e=>{
  const s=e.target.closest('[data-src]'); if(s){ setSource(DB.tab.id, s.value); return; }
  const c=e.target.closest('[data-cmp]'); if(c){ DB.cmp[c.dataset.cmp]=c.value; save(); render(); return; }
});
content.addEventListener('input',e=>{ const el=e.target; if(!el.dataset.k) return; sheetById(DB.tab.id).vals[el.dataset.k][+el.dataset.i]=el.value; });
content.addEventListener('focusout',e=>{ const el=e.target; if(!el.dataset.k) return;
  const f=INPUTS.find(x=>x.k===el.dataset.k), raw=el.value;
  let out=''; if(raw.trim()!==''){ const n=Math.abs(parseNum(raw)); out = f.t==='money' ? fmtMoneyIn(n) : String(Math.round(n)); }
  el.value=out; sheetById(DB.tab.id).vals[f.k][+el.dataset.i]=out; save(); refreshCalc(DB.tab.id);
});
content.addEventListener('keydown',e=>{ const el=e.target; if(!el.dataset.k) return;
  if(e.key==='Enter'){ e.preventDefault(); const all=[...content.querySelectorAll(`input[data-k][data-i="${el.dataset.i}"]`)], nx=all[all.indexOf(el)+1]; if(nx) nx.focus(); else el.blur(); }
});
document.getElementById('btnBackup').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify(Object.assign({app:'ambiente-padrao-planilha'},DB),null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Ambiente-Padrao-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); setTimeout(()=>a.remove(),300); toast('Backup baixado');
});
document.getElementById('btnImport').addEventListener('click',()=>document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result); let nd=null;
      if(Array.isArray(d.sheets) && d.sheets.length) nd=d;
      if(!nd) throw 0;
      modal({ title:'Abrir backup', sub:'Substituir os dados atuais pelos do arquivo?', body:'<div style="font-size:12.5px;color:#565c68">As planilhas, dashboards e o comparativo serão trocados pelos do backup.</div>', ok:'Substituir', danger:true,
        onOk(){ DB=nd; DB.sheets.forEach(s=>s.vals=normVals(s.vals)); if(!DB.cmp) DB.cmp={a:sheets()[0].id,b:sheets()[sheets().length-1].id,period:'ALL'}; if(!DB.dashboards) DB.dashboards=[]; save(); render(); toast('Backup carregado'); } });
    }catch(_){ toast('Arquivo inválido: use um backup salvo por esta planilha'); } e.target.value=''; };
  rd.readAsText(f);
});
document.getElementById('btnPdf').addEventListener('click',()=>{
  const t=DB.tab; let label = t.kind==='sheet'? sheetById(t.id).name : t.kind==='dash'? dashById(t.id).name : `Comparativo ${yearOf(sheetById(DB.cmp.a))} x ${yearOf(sheetById(DB.cmp.b))}`;
  const per = t.kind==='dash'? dashById(t.id).period : t.kind==='cmp'? DB.cmp.period : 'ALL';
  if(per && per!=='ALL') label+=' · '+PERIOD_LABELS[per];
  document.getElementById('printInfo').innerHTML = `<b style="color:#f7f8fa">${esc(label)}</b><br>gerado em ${new Date().toLocaleDateString('pt-BR')}`;
  const old=document.title; document.title='Ambiente Padrao - '+label.replace(/·/g,'-')+' - '+new Date().toLocaleDateString('pt-BR').replace(/\//g,'-');
  if(t.kind==='cmp') drawAcc();
  setTimeout(()=>{ window.print(); document.title=old; },60);
});

showSaved(); render();
</script>
</body>
</html>
